name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WinUI application
        run: dotnet build src/FluentControl/FluentControl.csproj -c Release -p:Platform=x64
      - name: Publish application folder
        run: dotnet publish src/FluentControl/FluentControl.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o publish
      - name: Inspect XAML deployment
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse -Include *.xbf,*.pri,*.xaml | Select-Object FullName,Length | Format-Table -AutoSize
          Get-ChildItem src/FluentControl/obj -Recurse -Include App.g.i.cs,MainWindow.g.i.cs | ForEach-Object { Get-Content $_.FullName }
      - name: Verify published application opens a window
        shell: pwsh
        run: ./scripts/Test-Startup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FluentControl-win-x64
          path: publish/
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluentControl-startup-logs
          path: ~/AppData/Local/FluentControl/Logs/
          if-no-files-found: ignore
