name: Windows build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify Windows changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine validation scope
        id: scope
        run: python3 scripts/ci-changes.py
  build:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PACKAGE_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Validate release scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Test WiX license boundary before restoring tools
        shell: pwsh
        run: ./tests/installer/Test-WixPolicy.ps1
      - name: Test device control logic and native mouse settings
        run: dotnet run --project tests/FluentControl.Tests -c Release -- --native
      - name: Compile Fluent setup frontend
        run: dotnet build installer/FluentControl.Setup/FluentControl.Setup.csproj -c Release
      - name: Prepare pinned standalone USB recovery tool
        shell: pwsh
        run: ./scripts/Get-Esptool.ps1
      - name: Build and test independent FCS Gateway
        run: |
          dotnet build src/FluentControl.FcsGateway/FluentControl.FcsGateway.csproj -c Release
          dotnet run --project src/FluentControl.FcsGateway/FluentControl.FcsGateway.csproj -c Release -- --self-test
      - name: Test FCS manager UI without physical hardware
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/fcs-ui" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright setup failed.' }
          $env:NODE_PATH = "$env:RUNNER_TEMP/fcs-ui/node_modules"
          node tests/fcs-manager/ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'FCS manager UI checks failed.' }
      - name: Build WinUI application
        run: dotnet build src/FluentControl/FluentControl.csproj -c Release -p:Platform=x64
      - name: Publish portable standalone FCS Gateway
        run: dotnet publish src/FluentControl.FcsGateway/FluentControl.FcsGateway.csproj -c Release -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -o artifacts/fcs-gateway
      - name: Publish application folder
        run: dotnet publish src/FluentControl/FluentControl.csproj -c Release -p:PublishProfile=Installer -p:Platform=x64 -p:Version=$env:PACKAGE_VERSION -o publish
      - name: Verify application XAML resources are published
        shell: pwsh
        run: |
          $appResources = @('publish/resources.pri', 'publish/FluentControl.pri') | Where-Object { Test-Path $_ }
          if (-not $appResources) { throw 'Application PRI is missing from publish output; the main window cannot load.' }
          Get-Item $appResources | Select-Object Name,Length | Format-Table -AutoSize
      - name: Verify published application opens a window
        shell: pwsh
        run: |
          ./scripts/Test-DdcHost.ps1
          ./scripts/Test-Startup.ps1
          if (-not (Test-Path 'publish/FluentControl.FcsGateway.exe')) { throw 'Bundled FCS Gateway is missing.' }
          if (-not (Test-Path 'publish/esptool/esptool.exe')) { throw 'Bundled recovery tool is missing.' }
          if (-not (Test-Path 'publish/fcs-script-runner.py')) { throw 'Bundled FCS script worker is missing.' }
          python scripts/test-fcs-manager.py ./publish/FluentControl.FcsGateway.exe
          if ($LASTEXITCODE -ne 0) { throw 'Gateway manager checks failed.' }
          python scripts/test-fcs-scripts.py ./publish/FluentControl.FcsGateway.exe
          if ($LASTEXITCODE -ne 0) { throw 'Gateway script checks failed.' }
      - name: Build single compressed offline MSI
        shell: pwsh
        run: ./scripts/Build-Msi.ps1 -Version $env:PACKAGE_VERSION
      - name: Build offline Fluent setup EXE
        shell: pwsh
        run: ./scripts/Build-Setup.ps1 -Version $env:PACKAGE_VERSION
      - name: Verify Fluent setup opens and cancels
        shell: pwsh
        run: ./scripts/Test-Setup.ps1 -Version $env:PACKAGE_VERSION -SmokeOnly
      - name: Verify MSI install, upgrade, installed UI, tray and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/Test-Msi.ps1 -Version $env:PACKAGE_VERSION
      - name: Verify Fluent setup UI, migration, repair and uninstall
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/Test-Setup.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FCS-Gateway-x64
          path: artifacts/fcs-gateway/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentControl-MSI-x64
          path: artifacts/installer/*.msi
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentControl-Setup-x64
          path: artifacts/installer/*-Setup.exe
          compression-level: 0
          if-no-files-found: error
      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentControl-installer-logs
          path: |
            artifacts/msi-logs/
            artifacts/setup-logs/
            artifacts/obj/**/size-report.json
            artifacts/obj/**/payload.json
            artifacts/obj/**/frontend-payload.json
            artifacts/obj/**/signatures.json
          if-no-files-found: ignore
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentControl-startup-logs
          path: ~/AppData/Local/FluentControl/Logs/
          if-no-files-found: ignore

  windows-validation:
    name: Windows validation
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful validation or an explicit documentation-only skip
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CLASSIFICATION" != "success" ]]; then
            echo "Change classification failed or was cancelled."
            exit 1
          fi
          if [[ "$WINDOWS_REQUIRED" == "false" && "$BUILD_RESULT" == "skipped" ]]; then
            echo "Documentation/metadata only; Windows validation not needed."
          elif [[ "$WINDOWS_REQUIRED" == "true" && "$BUILD_RESULT" == "success" ]]; then
            echo "Full Windows, native UI and MSI validation passed."
          else
            echo "Windows validation did not pass: $BUILD_RESULT"
            exit 1
          fi
