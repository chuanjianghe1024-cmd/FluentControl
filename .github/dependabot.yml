version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - /src/FluentControl
      - /src/FluentControl.DdcHost
      - /tests/FluentControl.Tests
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
